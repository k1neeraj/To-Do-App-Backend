name: Refresh npm lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/refresh-lockfile.yml

concurrency:
  group: refresh-lockfile-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply available non-breaking security fixes
        run: npm audit fix --package-lock-only --ignore-scripts || echo "Some advisories require manual review; continuing to save available lockfile fixes."
      - name: Check production dependencies
        run: npm audit --omit=dev
      - name: Commit updated lockfile if needed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh npm lockfile"
            git pull --rebase origin main
            git push origin main
          fi
