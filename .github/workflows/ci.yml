name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "**.js"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.js"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
